name: kkbox-cover-scanner

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  # push:
  #   paths:
  #     - 'scanner.py'  # 修改代码保存后自动触发

concurrency:
  group: nogi-scanner-group
  cancel-in-progress: false

jobs:
  scan-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v3

    - name: 2. 配置 Python 3.10 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 部署 Python 依赖包 (RapidOCR)
      run: |
        python -m pip install --upgrade pip
        pip install requests opencv-python-headless numpy rapidocr_onnxruntime

    - name: 4. 执行核心扫描脚本
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        PYTHONUNBUFFERED: "1"  
      run: python scanner_fast3.py

    - name: 5. 持久化保存进度
      if: always()
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add scan_state.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scan state" && git pull --rebase && git push)
