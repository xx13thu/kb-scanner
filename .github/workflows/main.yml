name: kkbox-cover-scanner

on:
  schedule:
    - cron: '0 */2 * * *'  # 每 2 小时自动运行一次
  workflow_dispatch:       # 允许你在网页上手动点击运行

jobs:
  scan-and-push:
    runs-on: ubuntu-latest # 使用 GitHub 免费提供的 7GB 内存 Linux 虚拟机

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v3

    - name: 2. 配置 Python 3.10 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 部署底层模块 (Tesseract C++ 引擎)
      # 这是最关键的一步，Ubuntu 虚拟机出厂没有 Tesseract，必须通过 apt-get 安装
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

    - name: 4. 部署 Python 依赖包
      # 安装我们代码需要的接口库和图像处理库
      run: |
        python -m pip install --upgrade pip
        pip install requests pytesseract opencv-python-headless numpy

    - name: 5. 执行核心扫描脚本
      # 从 Secrets 中把密钥注入到环境变量里，供 Python 读取
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: python scanner.py

    - name: 6. 持久化保存进度 (回写 scan_state.json)
      # 每次扫完，把最新的起点数字保存回 GitHub 仓库，下次开机接着跑
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add scan_state.json
        # 如果文件有变动就提交，没有变动就跳过，防止报错
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scan state" && git push)
